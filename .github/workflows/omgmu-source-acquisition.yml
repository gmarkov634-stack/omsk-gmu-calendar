name: OmGMU source acquisition

on:
  pull_request:
    paths:
      - "api/src/adapters/omgmu/**"
      - "api/tools/omgmu-*.mjs"
      - "api/test/omgmu-*.test.js"
      - "package.json"
      - ".github/workflows/omgmu-source-acquisition.yml"
  push:
    branches:
      - main
    paths:
      - "api/src/adapters/omgmu/**"
      - "api/tools/omgmu-*.mjs"
      - "api/test/omgmu-*.test.js"
      - "package.json"
      - ".github/workflows/omgmu-source-acquisition.yml"

permissions:
  contents: read

jobs:
  source-acquisition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run offline source tests
        run: npm run test:source

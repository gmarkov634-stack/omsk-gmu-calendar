name: OmGMU tenant tests

on:
  pull_request:
    paths:
      - "api/src/adapters/omgmu/**"
      - "api/test/omgmu-migrated-parsers.test.js"
      - "api/test/omgmu-review-boundary.test.js"
      - "api/test/omgmu-canonical-review-policy.test.js"
      - ".github/workflows/omgmu-parser-tests.yml"
  push:
    branches:
      - main
    paths:
      - "api/src/adapters/omgmu/**"
      - "api/test/omgmu-migrated-parsers.test.js"
      - "api/test/omgmu-review-boundary.test.js"
      - "api/test/omgmu-canonical-review-policy.test.js"
      - ".github/workflows/omgmu-parser-tests.yml"

permissions:
  contents: read

jobs:
  tenant-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tenant unit tests
        run: node --test api/test/omgmu-migrated-parsers.test.js api/test/omgmu-review-boundary.test.js api/test/omgmu-canonical-review-policy.test.js
